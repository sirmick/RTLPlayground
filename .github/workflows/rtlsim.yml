# rtlsim.yml - RTLPlayground's firmware, run in rtlsim (github.com/sirmick/ovs-rtlpg)
# and tested by rtlpg-tests (github.com/sirmick/rtlpg-tests).
#
# The same file goes in every branch of the RTLPlayground fork at
# .github/workflows/rtlsim.yml, beside build.yml; this copy, in rtlpg-tests'
# ci/, is the one to change. The tests take either firmware's CLI
# (rtlpg-tests lib/fwcli.py), so compact-layout, feat/sched and main run
# the same tests.
#
# build.yml proves the firmware compiles and the host unit tests pass. This
# proves the real image runs: it boots to the CLI matching silicon, answers
# ARP/ICMP/TCP and the web UI, switches VLANs, keeps its config across a web
# update, survives a power cut during an update, migrates standard->compact,
# and loads the PoE controller.
#
# A push runs the quick tiers (sim, core, net: a few minutes); main and pull
# requests run them all (powercut, the flash matrix, the VM: half an hour).
#
# These tests are FUNCTIONAL, not silicon-timing-faithful: rtlsim's flash and
# CPU clock are not the real chip's, so a green run is not a green light to
# flash hardware - the bench is the final gate.
name: rtlsim

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  rtlsim:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the firmware (this repo)
        uses: actions/checkout@v6
        with:
          path: branch        # same path as build.yml, so the SDCC cache is shared
      - name: Check out rtlsim
        uses: actions/checkout@v6
        with:
          repository: sirmick/ovs-rtlpg
          path: ovs-rtlpg
      - name: Check out the tests
        uses: actions/checkout@v6
        with:
          repository: sirmick/rtlpg-tests
          path: rtlpg-tests
          # a private rtlpg-tests needs a token that can read it
          token: ${{ secrets.RTLPG_TESTS_TOKEN || github.token }}

      - name: Pick the tiers
        id: tiers
        run: |
          if [ "${{ github.event_name }}" = pull_request ] || [ "${{ github.ref }}" = refs/heads/main ]; then
            echo "tiers=sim core net update powercut flash vm" >> "$GITHUB_OUTPUT"
          else
            echo "tiers=sim core net" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          # firmware build
          sudo apt-get install -y build-essential bison flex libboost-dev patch bzip2 \
            xxd python-is-python3 libjson-c-dev zlib1g-dev
          # rtlsim and the test tiers: OVS + netns, QEMU, the multicast oracle, helpers
          sudo apt-get install -y openvswitch-switch qemu-system-x86 qemu-utils \
            python3-scapy python3-yaml tcpdump ethtool jq iproute2 socat curl

      - name: Cache the patched SDCC
        uses: actions/cache@v4
        with:
          path: branch/toolchain
          key: sdcc-${{ hashFiles('branch/sdcc/*') }}

      - name: Build the firmware (SWTG024AS, compact)
        run: cd branch && make CI=1 MACHINE=SWGT024_V2_0_UNMANAGED LAYOUT=compact

      - name: Build the rtlsim image matrix (flash tier)
        if: contains(steps.tiers.outputs.tiers, 'flash')
        run: cd branch && make rtlsim-images OUT="$HOME/rtlsim/images/ci"

      - name: Run the tests
        run: |
          rtlpg-tests/ci/run.sh "$GITHUB_WORKSPACE/branch" "$GITHUB_WORKSPACE/ovs-rtlpg" \
            ${{ steps.tiers.outputs.tiers }}
